services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicflow-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow_dev
      POSTGRES_DB: civicflow

    ports:
      - "5432:5432"

    volumes:
      - civicflow_postgres_data:/var/lib/postgresql/data

volumes:
  civicflow_postgres_data: